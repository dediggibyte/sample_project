[project]
name = "obsidian-mcp"
version = "0.1.0"
description = "MCP server for Obsidian vaults — filesystem (phone sync) or Local REST API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Obsidian MCP" }]
keywords = ["mcp", "obsidian", "notes", "markdown"]
dependencies = [
  "mcp[cli]>=1.27,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
obsidian-mcp = "obsidian_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
